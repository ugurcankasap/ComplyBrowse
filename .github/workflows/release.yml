name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release notes
        shell: bash
        run: test -f "releases/${GITHUB_REF_NAME}.md"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "ComplyBrowse $GITHUB_REF_NAME"
          --notes-file "releases/$GITHUB_REF_NAME.md"