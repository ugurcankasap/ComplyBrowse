name: Browser Security CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  publish-safety:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Private artifact and evidence leak gate
        shell: powershell
        run: powershell -ExecutionPolicy RemoteSigned -File .\tools\check_publish_safety.ps1

  quality-gates:
    runs-on: ubuntu-latest
    env:
      BROWSER_SECURITY_QUIET: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall browser_security_agent.py tests qa_tests tools

      - name: Python lint
        run: python -m ruff check browser_security_agent.py macos_local_report.py tests qa_tests tools

      - name: Contract tests
        run: python -m unittest discover -s qa_tests -p "test_*.py" -v

      - name: Coverage gate
        run: |
          coverage run --source=browser_security_agent,tests -m unittest discover -s qa_tests -p "test_*.py"
          coverage report --fail-under=60

  powershell-lint:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber

      - name: PowerShell lint
        shell: powershell
        run: |
          $files = Get-ChildItem -Path . -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '\\(artifacts|reports|releases|\.git)\\' }
          $results = $files | Invoke-ScriptAnalyzer -Settings .\PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

  verification-regression:
    # Optional: runs only on push to main branch (requires browsers installed)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Edge results
        shell: powershell
        run: powershell -ExecutionPolicy RemoteSigned -File .\test_runner.ps1 -OutputJSON -OutputFile .\edge_test_results.json

      - name: Generate Chrome results
        shell: powershell
        run: powershell -ExecutionPolicy RemoteSigned -File .\chrome_test_runner.ps1 -OutputJSON -OutputFile .\chrome_test_results.json

      - name: Generate Firefox results
        shell: powershell
        run: powershell -ExecutionPolicy RemoteSigned -File .\firefox_test_runner.ps1 -OutputJSON -OutputFile .\firefox_test_results.json

      - name: Apply value verification (Edge)
        shell: powershell
        run: powershell -ExecutionPolicy RemoteSigned -File .\apply_verification.ps1 -InputFile .\edge_test_results.json -Browser edge -OutputFile .\edge_verified.json

      - name: Apply value verification (Chrome)
        shell: powershell
        run: powershell -ExecutionPolicy RemoteSigned -File .\apply_verification.ps1 -InputFile .\chrome_test_results.json -Browser chrome -OutputFile .\chrome_verified.json

      - name: Apply value verification (Firefox)
        shell: powershell
        run: powershell -ExecutionPolicy RemoteSigned -File .\apply_verification.ps1 -InputFile .\firefox_test_results.json -Browser firefox -OutputFile .\firefox_verified.json

      - name: Result integrity audit (Edge)
        shell: powershell
        run: powershell -ExecutionPolicy RemoteSigned -File .\audit_result_integrity.ps1 -InputFile .\edge_verified.json

      - name: Result integrity audit (Chrome)
        shell: powershell
        run: powershell -ExecutionPolicy RemoteSigned -File .\audit_result_integrity.ps1 -InputFile .\chrome_verified.json

      - name: Result integrity audit (Firefox)
        shell: powershell
        run: powershell -ExecutionPolicy RemoteSigned -File .\audit_result_integrity.ps1 -InputFile .\firefox_verified.json

      - name: Verification engine self-validation
        shell: powershell
        run: powershell -ExecutionPolicy RemoteSigned -File .\validate_verification_engine.ps1

      - name: Verification regression gates
        shell: powershell
        run: powershell -ExecutionPolicy RemoteSigned -File .\qa_tests\verification_regression_gate.ps1

  macos-fixtures:
    # GitHub-hosted macOS runners are not MDM-enrolled. Run only deterministic
    # fixture tests here; never attempt real-device L1 collection in CI.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python lint
        run: python -m ruff check browser_security_agent.py macos_local_report.py tests qa_tests tools

      - name: Validate macOS launcher syntax
        run: zsh -n ./run_macos_security.command

      - name: macOS fixture tests only
        run: python -m unittest qa_tests.test_macos_fixtures qa_tests.test_public_report_sanitization -v

      - name: Report fixture-only scope
        run: |
          {
            echo "## macOS fixture-only validation"
            echo "This job validates deterministic synthetic fixtures and public-report sanitization."
            echo "It does not collect live browser, MDM, profile, or L1 enforcement evidence."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage gate
        run: |
          python -m coverage run -m unittest qa_tests.test_macos_fixtures qa_tests.test_public_report_sanitization
          python -m coverage report --include='*/qa_tests/test_macos_fixtures.py' --fail-under=60
